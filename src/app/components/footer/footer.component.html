<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-brand">
      <div class="brand">Fieldwork</div>
      <p>A small product design and engineering studio.</p>
    </div>

    <nav class="footer-links">
      <a routerLink="/">Home</a>
      <a routerLink="/about">About</a>
      <a routerLink="/services">Services</a>
      <a routerLink="/contact">Contact</a>
    </nav>

    <div class="footer-social">
      <a
        mat-icon-button
        href="https://github.com"
        target="_blank"
        rel="noopener"
        aria-label="Fieldwork on GitHub"
      >
        <mat-icon>code</mat-icon>
      </a>
      <a
        mat-icon-button
        href="https://linkedin.com"
        target="_blank"
        rel="noopener"
        aria-label="Fieldwork on LinkedIn"
      >
        <mat-icon>work</mat-icon>
      </a>
      <a mat-icon-button href="mailto:hello@fieldwork.example" aria-label="Email Fieldwork">
        <mat-icon>mail</mat-icon>
      </a>
    </div>
  </div>

  <div class="container copyright">
    <p>© {{ year }} Fieldwork. All rights reserved.</p>
  </div>
</footer>
